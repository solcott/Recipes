name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # io.github.solcott:dataresult* and uistate* resolve from GitHub Packages, which authenticates
  # even public reads. settings.gradle.kts falls back to GITHUB_ACTOR/GITHUB_TOKEN.
  packages: read

jobs:
  build:
    # Linux still compiles the iOS klibs; it only skips linking the frameworks. Switch to
    # macos-latest, as kmp-dataresult does, for full Apple coverage.
    runs-on: ubuntu-latest
    env:
      MEALDB_API_KEY: ${{ secrets.MEALDB_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corretto 25 matches gradle/gradle-daemon-jvm.properties, so foojay has nothing to provision.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The check halves of `ktfmtFormat sortDependencies`: CI reports, it doesn't rewrite.
      - name: Check formatting
        run: ./gradlew ktfmtCheck checkSortDependencies

      - name: Detekt
        run: ./gradlew detektAll

      # Before Build on purpose. `reportsDestination` is a project-level Compose compiler setting
      # that every target of a module writes to, so only this invocation -- which compiles the one
      # designated target -- leaves a single writer and a deterministic report.
      - name: Compose stability
        run: ./gradlew composeStabilityCheck

      # The Compose compiler names its reports after the Kotlin module, which here is the Gradle
      # project path -- `Recipes:domain-classes.txt`. upload-artifact rejects a colon in a path, so
      # stage a renamed copy. Done immediately after the check rather than at the end of the job, so
      # the artifact is exactly what the check read: `build` below recompiles the other targets over
      # the same directory.
      - name: Stage Compose reports
        if: always()
        run: |
          mkdir -p compose-reports
          for src in */build/reports/compose; do
            [ -d "$src" ] || continue
            mkdir -p "compose-reports/${src%%/*}"
            cp -R "$src/." "compose-reports/${src%%/*}/"
          done
          find compose-reports -depth -name '*:*' | while read -r path; do
            mv "$path" "$(dirname "$path")/$(basename "$path" | tr ':' '_')"
          done

      # continue-on-error: this is diagnostics. A bad upload must not fail the job and skip `Build`,
      # which is exactly what happened the first time this workflow ran.
      - name: Upload Compose reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: compose-reports
          path: compose-reports
          if-no-files-found: warn

      - name: Build
        run: ./gradlew build
