name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # io.github.solcott:dataresult* and uistate* resolve from GitHub Packages, which authenticates
  # even public reads. settings.gradle.kts falls back to GITHUB_ACTOR/GITHUB_TOKEN.
  packages: read

jobs:
  build:
    # Linux still compiles the iOS klibs; it only skips linking the frameworks. Switch to
    # macos-latest, as kmp-dataresult does, for full Apple coverage.
    runs-on: ubuntu-latest
    env:
      MEALDB_API_KEY: ${{ secrets.MEALDB_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corretto 25 matches gradle/gradle-daemon-jvm.properties, so foojay has nothing to provision.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The check halves of `ktfmtFormat sortDependencies`: CI reports, it doesn't rewrite.
      - name: Check formatting
        run: ./gradlew ktfmtCheck checkSortDependencies

      - name: Detekt
        run: ./gradlew detektAll

      # Before Build on purpose. `reportsDestination` is a project-level Compose compiler setting
      # that every target of a module writes to, so only this invocation -- which compiles the one
      # designated target -- leaves a single writer and a deterministic report.
      - name: Compose stability
        run: ./gradlew composeStabilityCheck

      - name: Upload Compose reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-reports
          path: '**/build/reports/compose/**'
          if-no-files-found: warn

      - name: Build
        run: ./gradlew build
