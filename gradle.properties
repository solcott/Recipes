# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

version=1.0.0

# Compose Hot Reload needs a JetBrains Runtime for enhanced class redefinition.
# Gradle provisions JBR 21 through the foojay resolver in settings.gradle.kts.
compose.reload.jbr.autoProvisioningEnabled=true

# Incremental compilation of klib artifacts (Beta as of Kotlin 2.4.20).
# The two iOS targets had no native incrementality at all before this.
kotlin.incremental.native=true

# Closed-world multi-module Wasm compilation for dev builds, monolith for production:
# faster wasmJs recompiles in the dev loop without giving up production binary size.
kotlin.wasm.compilationMode=multimodule-closed-world-only-in-dev

# Build Tools API for the non-JVM targets. Experimental in 2.4.20, on by default in
# Kotlin 2.5.0 — turned on early so breakage surfaces here rather than at that bump.
kotlin.js.runViaBuildToolsApi=true
kotlin.wasm.runViaBuildToolsApi=true
kotlin.metadata.runViaBuildToolsApi=true
